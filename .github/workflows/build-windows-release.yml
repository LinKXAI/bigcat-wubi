name: Build unsigned Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build-unsigned-installer:
    name: Build unsigned installer
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out public source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report PowerShell versions
        shell: powershell
        run: |
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion)"
          pwsh -NoProfile -Command 'Write-Host "PowerShell $($PSVersionTable.PSVersion)"'

      - name: Install pinned Inno Setup 7.1.0
        shell: pwsh
        run: |
          $uri = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expectedSize = 14304168
          $expectedSha256 = '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F'
          $bootstrap = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $bootstrapLog = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.log'
          $installRoot = Join-Path $env:RUNNER_TEMP 'inno-setup-7.1.0'

          Invoke-WebRequest -Uri $uri -OutFile $bootstrap
          $download = Get-Item -LiteralPath $bootstrap
          if ($download.Length -ne $expectedSize) {
            throw "Inno Setup size mismatch: expected $expectedSize, got $($download.Length)."
          }
          $actualSha256 = (Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Inno Setup SHA-256 mismatch: expected $expectedSha256, got $actualSha256."
          }

          $process = Start-Process -FilePath $bootstrap -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            '/PORTABLE=1',
            "/DIR=$installRoot",
            "/LOG=$bootstrapLog"
          ) -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Inno Setup bootstrap did not finish within 120 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $bootstrapLog -PathType Leaf) {
              Get-Content -LiteralPath $bootstrapLog -Tail 100
            }
            throw "Inno Setup bootstrap exited with code $($process.ExitCode)."
          }

          $iscc = Join-Path $installRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not installed at the expected path: $iscc"
          }
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned Inno Setup source: $uri"
          & $iscc --version

      - name: Build unsigned Windows installer
        shell: pwsh
        run: ./scripts/Build-WindowsInstaller.ps1 -ISCCPath $env:INNO_ISCC

      - name: Generate checksums and build metadata
        shell: pwsh
        run: |
          $version = & ./scripts/Get-WindowsInstallerVersion.ps1
          $installer = Get-Item -LiteralPath './dist/windows/BigCatWubi-Setup.exe'
          $installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          $innoVersion = (& $env:INNO_ISCC --version 2>&1 | Out-String).Trim()
          $windowsPowerShellVersion = powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          $powerShellVersion = $PSVersionTable.PSVersion.ToString()
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          [System.IO.File]::WriteAllText(
            (Join-Path $installer.DirectoryName 'SHA256SUMS.txt'),
            "$installerSha256  $($installer.Name)`n",
            $utf8NoBom)

          $metadata = [ordered]@{
            schemaVersion = 1
            unsigned = $true
            repository = $env:GITHUB_REPOSITORY
            commitSha = $env:GITHUB_SHA
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runner = $env:RUNNER_NAME
            builtAtUtc = [DateTime]::UtcNow.ToString('o')
            version = [ordered]@{
              releaseTag = $version.ReleaseTag
              displayVersion = $version.DisplayVersion
              numericVersion = $version.NumericVersion
            }
            installer = [ordered]@{
              fileName = $installer.Name
              size = $installer.Length
              sha256 = $installerSha256
            }
            toolchain = [ordered]@{
              innoSetup = $innoVersion
              innoSetupBootstrapSha256 = '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F'
              windowsPowerShell = $windowsPowerShellVersion.Trim()
              powerShell = $powerShellVersion
            }
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $installer.DirectoryName 'build-metadata.json'),
            (($metadata | ConvertTo-Json -Depth 5) + "`n"),
            $utf8NoBom)

          Write-Host "Commit SHA: $env:GITHUB_SHA"
          Write-Host "Product version: $($version.DisplayVersion) ($($version.ReleaseTag); Windows $($version.NumericVersion))"
          Write-Host "Installer size: $($installer.Length) bytes"
          Write-Host "Installer SHA-256: $installerSha256"
          Write-Host "Inno Setup version: $innoVersion"
          Write-Host "Windows PowerShell version: $($windowsPowerShellVersion.Trim())"
          Write-Host "PowerShell version: $powerShellVersion"

          @"
          ## Unsigned Windows build

          - Commit: ``$env:GITHUB_SHA``
          - Product version: ``$($version.DisplayVersion)`` (``$($version.ReleaseTag)``; Windows ``$($version.NumericVersion)``)
          - Installer size: ``$($installer.Length)`` bytes
          - Installer SHA-256: ``$installerSha256``
          - Inno Setup: ``$innoVersion``
          - Windows PowerShell: ``$($windowsPowerShellVersion.Trim())``
          - PowerShell: ``$powerShellVersion``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload unsigned release artifact
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: bigcat-wubi-windows-unsigned
          path: |
            dist/windows/BigCatWubi-Setup.exe
            dist/windows/SHA256SUMS.txt
            dist/windows/build-metadata.json
          if-no-files-found: error

      - name: Report GitHub artifact identity
        shell: pwsh
        run: |
          Write-Host 'Artifact name: bigcat-wubi-windows-unsigned'
          Write-Host 'Artifact ID: ${{ steps.upload_unsigned.outputs.artifact-id }}'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @"
          - Artifact name: ``bigcat-wubi-windows-unsigned``
          - Artifact ID: ``${{ steps.upload_unsigned.outputs.artifact-id }}``
          "@
