# Rime schema
# encoding: utf-8

schema:
  schema_id: damao_wubi
  name: "大猫输入法"
  version: "0.1.3"
  icon: damao_wubi/branding/bigcat-ime.ico
  ascii_icon: damao_wubi/branding/bigcat-ime.ico
  author:
    - DaMao Input Method contributors
  description: |
    面向 Windows 11 + Weasel 的最小五笔 86 输入方案。
    依赖 rime/rime-wubi 提供的 wubi86 词典。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 中文标点, 西文标点 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;'"
  max_code_length: 4
  auto_select: true

translator:
  dictionary: wubi86
  user_dict: damao_wubi
  enable_user_dict: true
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  enable_completion: true

punctuator:
  import_preset: default
  digit_separators: "."

key_binder:
  import_preset: default
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/numbered_mode_switch
      - __append:
          - { when: composing, accept: Return, send: Escape }
          - { when: has_menu, accept: semicolon, send: 2 }
          - { when: has_menu, accept: apostrophe, send: 3 }
          - { when: has_menu, accept: period, send: period }

recognizer:
  import_preset: default
