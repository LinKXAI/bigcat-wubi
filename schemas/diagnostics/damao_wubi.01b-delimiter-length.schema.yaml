# Speller isolation: 01a plus delimiter, without auto_select.

schema:
  schema_id: damao_wubi
  name: "大猫输入法 Diagnostic 01b - Delimiter and Length"
  version: "0.1-diag-01b"

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;'"
  max_code_length: 4

translator:
  dictionary: wubi86
  enable_user_dict: false
  enable_sentence: false

punctuator:
  import_preset: default

key_binder:
  import_preset: default
