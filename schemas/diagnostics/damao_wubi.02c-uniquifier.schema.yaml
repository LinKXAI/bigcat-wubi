# Group 2 isolation: 01 plus uniquifier only.

schema:
  schema_id: damao_wubi
  name: "大猫输入法 Diagnostic 02c - Uniquifier"
  version: "0.1-diag-02c"

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;'"
  max_code_length: 4
  auto_select: true

translator:
  dictionary: wubi86
  enable_user_dict: false
  enable_sentence: false

punctuator:
  import_preset: default

key_binder:
  import_preset: default
