# Group 2 isolation: 01 plus switches only.

schema:
  schema_id: damao_wubi
  name: "大猫输入法 Diagnostic 02b - Switches"
  version: "0.1-diag-02b"

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 中文标点, 西文标点 ]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;'"
  max_code_length: 4
  auto_select: true

translator:
  dictionary: wubi86
  enable_user_dict: false
  enable_sentence: false

punctuator:
  import_preset: default

key_binder:
  import_preset: default
